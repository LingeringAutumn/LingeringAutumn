<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LingeringAutumn — Go Backend, AI Infra, Agent Systems</title>
  <desc id="desc">A systems signal-flow banner for LingeringAutumn's GitHub profile</desc>

  <defs>
    <linearGradient id="background" x1="24" y1="18" x2="1170" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.58" stop-color="#0B1930"/>
      <stop offset="1" stop-color="#161536"/>
    </linearGradient>
    <linearGradient id="signal" x1="78" y1="0" x2="1118" y2="0" gradientUnits="userSpaceOnUse">
