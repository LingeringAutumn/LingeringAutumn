    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#background)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="23" fill="url(#grid)"/>
